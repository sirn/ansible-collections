---
- name: test grafana configuration templates
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_hostname: testhost
  tasks:
    - name: load grafana defaults
      ansible.builtin.include_vars: ../roles/grafana/defaults/main.yml

    - name: Check datasource provisioning file ownership
      ansible.builtin.assert:
        that:
          - grafana_test_cleanup | length == 1
          - grafana_test_cleanup[0]['ansible.builtin.file'] == {'path':'/usr/local/etc/grafana/provisioning/datasources/victoriametrics.yml', 'state':'absent'}
          - "'Restart grafana' in grafana_test_cleanup[0].notify"
          - grafana_test_provisioning | length == 1
          - grafana_test_provisioning[0]['ansible.builtin.template'].dest == '/usr/local/etc/grafana/provisioning/datasources/default.yml'
      vars:
        grafana_test_tasks: "{{ lookup('file', '../roles/grafana/tasks/main_freebsd_s6.yml') | from_yaml }}"
        grafana_test_cleanup: >-
          {{ grafana_test_tasks | selectattr('name', 'equalto', 'Remove previous grafana datasource provisioning file') | list }}
        grafana_test_provisioning: >-
          {{ grafana_test_tasks | selectattr('name', 'equalto', 'Provision grafana datasources') | list }}

    - name: render grafana service command
      ansible.builtin.set_fact:
        grafana_run: "{{ lookup('template', '../roles/grafana/templates/run.j2') }}"

    - name: check foreground service command
      ansible.builtin.assert:
        that:
          - grafana_run is search('fdmove -c 2 1')
          - grafana_run is search('s6-setuidgid')
          - grafana_run is not search('/usr/sbin/daemon')

    - name: set Grafana configuration inputs
      ansible.builtin.set_fact:
        grafana_domain: monitor.example.test
        grafana_root_url: https://monitor.example.test/
        grafana_admin_password: test-only-password

    - name: render Grafana configuration
      ansible.builtin.set_fact:
        grafana_datasource: "{{ lookup('template', '../roles/grafana/templates/datasource.yml.j2') | from_yaml }}"
        grafana_dashboard_provider: "{{ lookup('template', '../roles/grafana/templates/dashboards.yml.j2') | from_yaml }}"
        grafana_config: "{{ lookup('template', '../roles/grafana/templates/grafana.ini.j2') }}"

    - name: check empty provisioning and authentication
      ansible.builtin.assert:
        that:
          - grafana_datasource == {'apiVersion':1, 'datasources':[]}
          - grafana_dashboard_provider.providers[0].options.path == '/usr/local/etc/grafana/dashboards'
          - grafana_allow_loading_unsigned_plugins == []
          - grafana_config is not search('allow_loading_unsigned_plugins')
          - grafana_config is search('http_addr = 127.0.0.1')
          - grafana_config is search('root_url = https://monitor.example.test/')
          - grafana_config is search('allow_sign_up = false')
          - grafana_config is search('\[auth.anonymous\]\nenabled = false')
          - grafana_config is search('\[auth.proxy\]\nenabled = false')

    - name: Set native datasource definitions
      ansible.builtin.set_fact:
        grafana_datasources:
          - name: Example Graphite
            uid: example-graphite
            type: graphite
            url: http://192.0.2.10:8080
            access: proxy
            isDefault: true
            editable: false
            jsonData:
              httpHeaderName1: X-Test-Header
              graphiteVersion: "1.1"
            secureJsonData:
              httpHeaderValue1: 'test-only: "quoted" value'
          - name: Example TestData
            type: grafana-testdata-datasource

    - name: Check datasource definitions are preserved without added settings
      ansible.builtin.assert:
        that:
          - (lookup('template', '../roles/grafana/templates/datasource.yml.j2') | from_yaml).datasources == grafana_datasources
          - lookup('template', '../roles/grafana/templates/grafana.ini.j2') is not search('allow_loading_unsigned_plugins')

    - name: Explicitly allow unsigned plugins
      ansible.builtin.set_fact:
        grafana_allow_loading_unsigned_plugins:
          - example-first-datasource
          - example-second-panel

    - name: Check only explicit plugin IDs are allowed
      ansible.builtin.assert:
        that:
          - >-
            lookup('template', '../roles/grafana/templates/grafana.ini.j2').split('allow_loading_unsigned_plugins = ')[1].split('\n')[0]
            == 'example-first-datasource,example-second-panel'
          - lookup('template', '../roles/grafana/templates/grafana.ini.j2') is not search('app_mode = development')

    - name: Remove unsigned plugin permission
      ansible.builtin.set_fact:
        grafana_allow_loading_unsigned_plugins: []

    - name: Check permission is independent of datasource definitions
      ansible.builtin.assert:
        that:
          - lookup('template', '../roles/grafana/templates/grafana.ini.j2') is not search('allow_loading_unsigned_plugins')
          - (lookup('template', '../roles/grafana/templates/datasource.yml.j2') | from_yaml).datasources == grafana_datasources
