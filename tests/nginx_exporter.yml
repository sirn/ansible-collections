---
- name: test nginx_exporter configuration templates
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_hostname: testhost
  tasks:
    - name: load nginx_exporter defaults
      ansible.builtin.include_vars: ../roles/nginx_exporter/defaults/main.yml

    - name: render nginx_exporter service command
      ansible.builtin.set_fact:
        nginx_exporter_run: "{{ lookup('template', '../roles/nginx_exporter/templates/run.j2') }}"

    - name: check foreground service command
      ansible.builtin.assert:
        that:
          - nginx_exporter_run is search('fdmove -c 2 1')
          - nginx_exporter_run is search('s6-setuidgid')
          - nginx_exporter_run is not search('/usr/sbin/daemon')
          - nginx_exporter_run is search('--web.listen-address=127.0.0.1:9113')
