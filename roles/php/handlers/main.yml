---
- name: rescan php-fpm s6
  become: true
  ansible.builtin.command: s6-svscanctl -an /var/service
  register: rescan_php_fpm_s6
  changed_when: rescan_php_fpm_s6 is succeeded
  failed_when: rescan_php_fpm_s6 is not succeeded

- name: restart php-fpm
  become: true
  ansible.builtin.command: s6-svc -t /var/service/php-fpm
  register: restart_php_fpm
  changed_when: restart_php_fpm is succeeded
  failed_when: restart_php_fpm is not succeeded

- name: restart php-fpm logger
  become: true
  ansible.builtin.command: s6-svc -t /var/service/php-fpm/log
  register: restart_php_fpm_logger
  changed_when: restart_php_fpm_logger is succeeded
  failed_when: restart_php_fpm_logger is not succeeded
