---
- name: Check the deployment method
  ansible.builtin.assert:
    that:
      - oauth2_proxy_deploy_container
    fail_msg: >-
      The oauth2_proxy role has one deployment method. Set
      oauth2_proxy_deploy_container to true on this host.
    quiet: true

- name: Include container deployment tasks
  ansible.builtin.include_tasks: "main_container.yml"
