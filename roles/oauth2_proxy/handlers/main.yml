---
- name: Restart oauth2-proxy container
  become: true
  ansible.builtin.systemd_service:
    name: "{{ oauth2_proxy_container_service_name_prefix }}-{{ item.name }}"
    state: restarted
    daemon_reload: true
  loop: "{{ oauth2_proxy_instances }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when:
    - oauth2_proxy_container_manage_service
    - not ansible_check_mode
