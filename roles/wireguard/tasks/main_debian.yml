---
## Install
##

- name: install wireguard
  become: true
  ansible.builtin.apt:
    name:
      - wireguard-tools
      - iptables
    state: present
  notify:
    - restart wireguard systemd

## Configure
##

- name: enable IP forwarding for relay
  become: true
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    reload: true
  when: wireguard_relay

- name: ensure wireguard configuration directory
  become: true
  ansible.builtin.file:
    dest: /etc/wireguard
    state: directory
    mode: "0700"

- name: configure wireguard
  become: true
  ansible.builtin.template:
    src: wg.conf.j2
    dest: "/etc/wireguard/{{ wireguard_interface }}.conf"
    mode: "0600"
  notify:
    - restart wireguard systemd

- name: enable wireguard
  become: true
  ansible.builtin.systemd:
    name: "wg-quick@{{ wireguard_interface }}"
    enabled: true
    state: started
