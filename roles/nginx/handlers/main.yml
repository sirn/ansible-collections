---
- name: rescan nginx s6
  become: true
  ansible.builtin.command: s6-svscanctl -an /var/service
  register: rescan_nginx_s6
  changed_when: rescan_nginx_s6 is succeeded
  failed_when: rescan_nginx_s6 is not succeeded

- name: wait for nginx supervision
  become: true
  ansible.builtin.command: "s6-svok {{ nginx_item }}"
  with_items:
    - /var/service/nginx
    - /var/service/nginx/log
  loop_control:
    loop_var: nginx_item
  register: nginx_supervision
  until: nginx_supervision is succeeded
  retries: 10
  delay: 1
  changed_when: false

- name: restart nginx
  become: true
  ansible.builtin.command: s6-svc -t /var/service/nginx
  register: restart_nginx
  changed_when: restart_nginx is succeeded
  failed_when: restart_nginx is not succeeded

- name: restart nginx logger
  become: true
  ansible.builtin.command: s6-svc -t /var/service/nginx/log
  register: restart_nginx_logger
  changed_when: restart_nginx_logger is succeeded
  failed_when: restart_nginx_logger is not succeeded

- name: restart nginx-cloudflare
  become: true
  ansible.builtin.command: s6-svc -t /var/service/nginx-cloudflare
  register: restart_nginx_cloudflare
  changed_when: restart_nginx_cloudflare is succeeded
  failed_when: restart_nginx_cloudflare is not succeeded

- name: restart nginx-cloudflare logger
  become: true
  ansible.builtin.command: s6-svc -t /var/service/nginx-cloudflare/log
  register: restart_nginx_cloudflare_logger
  changed_when: restart_nginx_cloudflare_logger is succeeded
  failed_when: restart_nginx_cloudflare_logger is not succeeded
