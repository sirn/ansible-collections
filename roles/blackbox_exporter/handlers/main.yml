---
- name: Rescan blackbox_exporter s6
  become: true
  ansible.builtin.command: s6-svscanctl -an /var/service
  register: blackbox_exporter_rescan_result
  changed_when: blackbox_exporter_rescan_result is succeeded
  failed_when: blackbox_exporter_rescan_result is not succeeded

- name: Wait for blackbox_exporter supervision
  become: true
  ansible.builtin.command: "s6-svok {{ blackbox_exporter_item }}"
  loop_control:
    loop_var: blackbox_exporter_item
  with_items:
    - /var/service/blackbox_exporter
    - /var/service/blackbox_exporter/log
  register: blackbox_exporter_supervision
  until: blackbox_exporter_supervision is succeeded
  retries: 10
  delay: 1
  changed_when: false

- name: Restart blackbox_exporter
  become: true
  ansible.builtin.command: s6-svc -t /var/service/blackbox_exporter
  register: blackbox_exporter_restart_result
  changed_when: blackbox_exporter_restart_result is succeeded
  failed_when: blackbox_exporter_restart_result is not succeeded

- name: Restart blackbox_exporter logger
  become: true
  ansible.builtin.command: s6-svc -t /var/service/blackbox_exporter/log
  register: blackbox_exporter_logger_restart_result
  changed_when: blackbox_exporter_logger_restart_result is succeeded
  failed_when: blackbox_exporter_logger_restart_result is not succeeded
