---
- name: Rescan victoria_logs s6
  become: true
  ansible.builtin.command: s6-svscanctl -an /var/service
  register: victoria_logs_rescan_result
  changed_when: victoria_logs_rescan_result is succeeded
  failed_when: victoria_logs_rescan_result is not succeeded

- name: Wait for victoria_logs supervision
  become: true
  ansible.builtin.command: "s6-svok {{ victoria_logs_item }}"
  loop_control:
    loop_var: victoria_logs_item
  with_items:
    - /var/service/victoria-logs
    - /var/service/victoria-logs/log
  register: victoria_logs_supervision
  until: victoria_logs_supervision is succeeded
  retries: 10
  delay: 1
  changed_when: false

- name: Restart victoria_logs
  become: true
  ansible.builtin.command: s6-svc -t /var/service/victoria-logs
  register: victoria_logs_restart_result
  changed_when: victoria_logs_restart_result is succeeded
  failed_when: victoria_logs_restart_result is not succeeded

- name: Restart victoria_logs logger
  become: true
  ansible.builtin.command: s6-svc -t /var/service/victoria-logs/log
  register: victoria_logs_logger_restart_result
  changed_when: victoria_logs_logger_restart_result is succeeded
  failed_when: victoria_logs_logger_restart_result is not succeeded
