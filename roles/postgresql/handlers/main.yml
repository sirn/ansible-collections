---
- name: rescan postgresql s6
  become: true
  ansible.builtin.command: s6-svscanctl -an /var/service
  register: rescan_postgresql_s6
  changed_when: rescan_postgresql_s6 is succeeded
  failed_when: rescan_postgresql_s6 is not succeeded

- name: restart postgresql
  become: true
  ansible.builtin.command: s6-svc -t /var/service/postgresql
  register: restart_postgresql
  changed_when: restart_postgresql is succeeded
  failed_when: restart_postgresql is not succeeded

- name: restart postgresql logger
  become: true
  ansible.builtin.command: s6-svc -t /var/service/postgresql/log
  register: restart_postgresql_logger
  changed_when: restart_postgresql_logger is succeeded
  failed_when: restart_postgresql_logger is not succeeded
