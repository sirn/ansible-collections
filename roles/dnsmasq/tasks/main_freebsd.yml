---
## Install
##

- name: install dnsmasq
  become: true
  community.general.pkgng:
    name:
      - dnsmasq
    state: latest
  register: dnsmasq_package

## Configure
##

- name: configure dnsmasq
  become: true
  ansible.builtin.template:
    src: dnsmasq.conf.j2
    dest: /usr/local/etc/dnsmasq.conf
    mode: "0644"
  register: dnsmasq_config

- name: check for a leftover s6 service
  ansible.builtin.stat:
    path: /var/service/dnsmasq
  register: dnsmasq_s6_service

# Turning the s6 flag off must leave a single supervisor behind. Wait for the
# supervised process to exit, so the rc service can start.
- name: stop the leftover s6 service
  become: true
  ansible.builtin.command: s6-svc -d /var/service/dnsmasq
  when: dnsmasq_s6_service.stat.exists

- name: wait for the leftover s6 service to stop
  become: true
  ansible.builtin.command: s6-svwait -d /var/service/dnsmasq
  when: dnsmasq_s6_service.stat.exists

- name: remove the leftover s6 service
  become: true
  ansible.builtin.file:
    path: /var/service/dnsmasq
    state: absent
  when: dnsmasq_s6_service.stat.exists

- name: rescan the s6 service directory
  become: true
  ansible.builtin.command: s6-svscanctl -an /var/service
  when: dnsmasq_s6_service.stat.exists

- name: enable and start dnsmasq
  become: true
  ansible.builtin.service:
    name: dnsmasq
    enabled: true
    state: >-
      {{ 'restarted'
         if dnsmasq_package is changed or dnsmasq_config is changed
         else 'started' }}
