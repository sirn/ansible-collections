---
- name: restart ntpd
  become: true
  ansible.builtin.service:
    name: ntpd
    state: restarted
  register: restart_ntpd
  changed_when: restart_ntpd is succeeded
  failed_when: restart_ntpd is not succeeded

- name: start ntpdate
  become: true
  ansible.builtin.service:
    name: ntpdate
    state: started
  ignore_errors: true
  register: start_ntpdate
  changed_when: start_ntpdate is succeeded
  failed_when: start_ntpdate is not succeeded

- name: start ntpd
  become: true
  ansible.builtin.service:
    name: ntpd
    state: started
  register: start_ntpd
  changed_when: start_ntpd is succeeded
  failed_when: start_ntpd is not succeeded

- name: rescan ntpd s6
  become: true
  ansible.builtin.command: s6-svscanctl -an /var/service
  register: rescan_ntpd_s6
  changed_when: rescan_ntpd_s6 is succeeded
  failed_when: rescan_ntpd_s6 is not succeeded

- name: restart ntpd s6
  become: true
  ansible.builtin.command: s6-svc -t /var/service/ntpd
  register: restart_ntpd_s6
  changed_when: restart_ntpd_s6 is succeeded
  failed_when: restart_ntpd_s6 is not succeeded

- name: restart ntpd logger s6
  become: true
  ansible.builtin.command: s6-svc -t /var/service/ntpd/log
  register: restart_ntpd_logger_s6
  changed_when: restart_ntpd_logger_s6 is succeeded
  failed_when: restart_ntpd_logger_s6 is not succeeded
