---
- name: flush pf
  become: true
  # Preserve connection states so loading rules does not interrupt SSH.
  ansible.builtin.command: pfctl -f /etc/pf.conf
  register: flush_pf
  changed_when: flush_pf is succeeded
  failed_when: flush_pf is not succeeded

- name: wait for pf flush
  ansible.builtin.wait_for_connection:
    delay: 10
    timeout: 600
  register: wait_for_pf_flush
  changed_when: false
