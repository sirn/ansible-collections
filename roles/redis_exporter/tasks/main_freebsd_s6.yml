---
- name: Install redis_exporter
  become: true
  community.general.pkgng:
    name: redis_exporter
    state: latest
  notify:
    - Restart redis_exporter

- name: Disable redis_exporter rc service
  become: true
  community.general.sysrc:
    name: redis_exporter_enable
    value: "NO"

- name: Check redis_exporter supervision
  become: true
  ansible.builtin.stat:
    path: /var/service/redis_exporter/supervise
  register: redis_exporter_supervise

# The rc script can match the s6-owned process. Stop it only during takeover.
- name: Stop redundant redis_exporter rc service
  become: true
  ansible.builtin.service:
    name: redis_exporter
    state: stopped
  when: not redis_exporter_supervise.stat.exists

- name: Ensure redis_exporter configuration directory
  become: true
  ansible.builtin.file:
    path: /usr/local/etc/redis_exporter
    state: directory
    owner: "{{ redis_exporter_user }}"
    mode: "0700"

- name: Configure redis_exporter password file
  become: true
  ansible.builtin.template:
    src: passwords.json.j2
    dest: /usr/local/etc/redis_exporter/passwords.json
    owner: "{{ redis_exporter_user }}"
    mode: "0600"
  no_log: true
  diff: false
  when: redis_exporter_password | length > 0
  notify:
    - Restart redis_exporter

- name: Remove unused redis_exporter password file
  become: true
  ansible.builtin.file:
    path: /usr/local/etc/redis_exporter/passwords.json
    state: absent
  when: redis_exporter_password | length == 0
  notify:
    - Restart redis_exporter

- name: Ensure redis_exporter log directory
  become: true
  ansible.builtin.file:
    path: /var/log/redis_exporter
    state: directory
    mode: "0755"

- name: Ensure redis_exporter service directories
  become: true
  ansible.builtin.file:
    path: "{{ redis_exporter_item }}"
    state: directory
    mode: "0755"
  loop_control:
    loop_var: redis_exporter_item
  with_items:
    - /var/service/redis_exporter
    - /var/service/redis_exporter/log

- name: Install redis_exporter service
  become: true
  ansible.builtin.template:
    src: run.j2
    dest: /var/service/redis_exporter/run
    mode: "0555"
  notify:
    - Rescan redis_exporter s6
    - Wait for redis_exporter supervision
    - Restart redis_exporter

- name: Install redis_exporter log service
  become: true
  ansible.builtin.copy:
    dest: /var/service/redis_exporter/log/run
    mode: "0555"
    content: "{{ redis_exporter_logger }}"
  notify:
    - Rescan redis_exporter s6
    - Wait for redis_exporter supervision
    - Restart redis_exporter logger

- name: Flush handler
  become: true
  ansible.builtin.meta: flush_handlers
